<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a8f7d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#FDF8F1"/>

  <text x="48" y="52" font-size="26" font-weight="800" fill="#111111" letter-spacing="-0.5">🛍️ Add an AI shopping agent to your store</text>
  <text x="48" y="76" font-size="13" fill="#8a8273">For retailers on Shopify (or any UCP storefront) — your shoppers chat, build baskets, and pay on your own checkout</text>

  <!-- ============ SECTION A: what the retailer does ============ -->
  <text x="48" y="116" font-size="11" font-weight="700" fill="#9a8f7d" letter-spacing="2">WHAT YOU DO — THE ENTIRE INTEGRATION</text>

  <!-- step 1 -->
  <rect x="48" y="128" width="368" height="188" rx="18" fill="#ffffff" stroke="#eadfce"/>
  <circle cx="86" cy="166" r="15" fill="#111111"/>
  <text x="86" y="171" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="112" y="172" font-size="16" font-weight="800" fill="#111111">Share your domain</text>
  <text x="72" y="204" font-size="13" fill="#444444">www.yourstore.com — that's it.</text>
  <text x="72" y="226" font-size="13" fill="#444444">Optionally: trading rules (free-shipping</text>
  <text x="72" y="244" font-size="13" fill="#444444">threshold, cutoffs), tone of voice, colors.</text>
  <text x="72" y="286" font-size="12" font-style="italic" fill="#9a8f7d">a form or an email · ~5 minutes</text>

  <path d="M416,222 L452,222" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ab)"/>

  <!-- step 2 -->
  <rect x="456" y="128" width="368" height="188" rx="18" fill="#ffffff" stroke="#eadfce"/>
  <circle cx="494" cy="166" r="15" fill="#111111"/>
  <text x="494" y="171" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="520" y="172" font-size="16" font-weight="800" fill="#111111">Paste one snippet</text>
  <rect x="480" y="190" width="320" height="30" rx="8" fill="#efe7dd"/>
  <text x="494" y="210" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#111111">&lt;script src=".../embed.js" async&gt;</text>
  <text x="480" y="244" font-size="13" fill="#444444">Website: one line in theme.liquid, or via</text>
  <text x="480" y="262" font-size="13" fill="#444444">Google Tag Manager. App: same snippet in</text>
  <text x="480" y="280" font-size="13" fill="#444444">your webview.</text>
  <text x="480" y="302" font-size="12" font-style="italic" fill="#9a8f7d">one line · no code deploy needed</text>

  <path d="M824,222 L860,222" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ab)"/>

  <!-- step 3 -->
  <rect x="864" y="128" width="368" height="188" rx="18" fill="#f2f7f3" stroke="#1d6b47" stroke-width="1.5"/>
  <circle cx="902" cy="166" r="15" fill="#1d6b47"/>
  <text x="902" y="171" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="928" y="172" font-size="16" font-weight="800" fill="#1d6b47">You're live</text>
  <text x="888" y="204" font-size="13" fill="#444444">A launcher button in your colors appears.</text>
  <text x="888" y="226" font-size="13" fill="#444444">Shoppers chat, see products with images,</text>
  <text x="888" y="244" font-size="13" fill="#444444">build rule-checked baskets — and pay on</text>
  <text x="888" y="262" font-size="13" font-weight="700" fill="#111111">your own hosted checkout.</text>
  <text x="888" y="292" font-size="12" font-style="italic" fill="#9a8f7d">orders land in your Shopify admin as normal</text>

  <!-- ============ SECTION B: behind the scenes ============ -->
  <path d="M640,322 L640,362" fill="none" stroke="#9a8f7d" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <text x="48" y="372" font-size="11" font-weight="700" fill="#9a8f7d" letter-spacing="2">MEANWHILE, ON OUR SIDE — AUTOMATED, INVISIBLE TO YOU</text>

  <rect x="48" y="384" width="1184" height="148" rx="18" fill="#ffffff" stroke="#eadfce"/>

  <rect x="76" y="412" width="250" height="92" rx="14" fill="#efe7dd"/>
  <text x="94" y="440" font-size="13.5" font-weight="800" fill="#111111">Probe your store</text>
  <text x="94" y="460" font-size="11.5" fill="#555555">/.well-known/ucp + products.json</text>
  <text x="94" y="477" font-size="11.5" fill="#555555">→ endpoint, currency, catalog,</text>
  <text x="94" y="494" font-size="11.5" fill="#555555">payment methods</text>
  <path d="M326,458 L362,458" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="366" y="412" width="250" height="92" rx="14" fill="#efe7dd"/>
  <text x="384" y="440" font-size="13.5" font-weight="800" fill="#111111">Generate your config</text>
  <text x="384" y="460" font-size="11.5" fill="#555555">one JSON file: catalog scope,</text>
  <text x="384" y="477" font-size="11.5" fill="#555555">trading rules, persona, theme,</text>
  <text x="384" y="494" font-size="11.5" fill="#555555">model choice</text>
  <path d="M616,458 L652,458" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="656" y="412" width="250" height="92" rx="14" fill="#efe7dd"/>
  <text x="674" y="440" font-size="13.5" font-weight="800" fill="#111111">Deploy your agent</text>
  <text x="674" y="460" font-size="11.5" fill="#555555">a dedicated instance at</text>
  <text x="674" y="477" font-size="11.5" fill="#555555">yourstore.agents.example.com</text>
  <text x="674" y="494" font-size="11.5" fill="#555555">(our model key, our infra)</text>
  <path d="M906,458 L942,458" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="946" y="412" width="258" height="92" rx="14" fill="#efe7dd"/>
  <text x="964" y="440" font-size="13.5" font-weight="800" fill="#111111">Hand you the snippet</text>
  <text x="964" y="460" font-size="11.5" fill="#555555">plus a demo page so you can</text>
  <text x="964" y="477" font-size="11.5" fill="#555555">try the agent before it goes</text>
  <text x="964" y="494" font-size="11.5" fill="#555555">anywhere near your shoppers</text>

  <!-- ============ SECTION C: never do / money ============ -->
  <rect x="48" y="560" width="560" height="168" rx="18" fill="#ffffff" stroke="#eadfce"/>
  <text x="76" y="594" font-size="14" font-weight="800" fill="#111111">What you never do</text>
  <text x="76" y="622" font-size="13" fill="#444444">✗  Install a Shopify app or grant an admin API token</text>
  <text x="76" y="646" font-size="13" fill="#444444">✗  Write any code or run any backend</text>
  <text x="76" y="670" font-size="13" fill="#444444">✗  Touch payments, PCI scope, or fraud settings</text>
  <text x="76" y="694" font-size="13" fill="#444444">✗  Export your catalog — we read your public UCP surface</text>

  <rect x="648" y="560" width="584" height="168" rx="18" fill="#fdf0ef" stroke="#b02230" stroke-width="1.5"/>
  <text x="676" y="594" font-size="14" font-weight="800" fill="#b02230">Where the money flows</text>
  <text x="676" y="622" font-size="13" fill="#444444">Payment completes on your own hosted checkout —</text>
  <text x="676" y="644" font-size="13" fill="#444444">Google Pay, card, Shop Pay, exactly as today. Card data never</text>
  <text x="676" y="666" font-size="13" fill="#444444">touches the agent. Orders, fraud screening, refunds, and</text>
  <text x="676" y="688" font-size="13" fill="#444444">settlement all stay on your existing rails.</text>
  <text x="676" y="714" font-size="12" font-style="italic" fill="#9a8f7d">the agent builds the basket; your store takes the payment</text>

  <!-- ============ SECTION D: next steps ============ -->
  <text x="48" y="774" font-size="11" font-weight="700" fill="#9a8f7d" letter-spacing="2">NEXT STEPS</text>
  <path d="M80,820 L1210,820" fill="none" stroke="#d8cdbb" stroke-width="2" marker-end="url(#ag)"/>

  <circle cx="140" cy="820" r="9" fill="#111111"/>
  <text x="140" y="802" font-size="13.5" font-weight="800" fill="#111111" text-anchor="middle">Pilot</text>
  <text x="140" y="844" font-size="11.5" fill="#555555" text-anchor="middle">your subdomain, demo lock,</text>
  <text x="140" y="860" font-size="11.5" fill="#555555" text-anchor="middle">a handful of real shoppers</text>

  <circle cx="440" cy="820" r="9" fill="#111111"/>
  <text x="440" y="802" font-size="13.5" font-weight="800" fill="#111111" text-anchor="middle">Measure</text>
  <text x="440" y="844" font-size="11.5" fill="#555555" text-anchor="middle">baskets built, click-through to checkout,</text>
  <text x="440" y="860" font-size="11.5" fill="#555555" text-anchor="middle">~$0.10 LLM cost per basket (less on Haiku)</text>

  <circle cx="760" cy="820" r="9" fill="#111111"/>
  <text x="760" y="802" font-size="13.5" font-weight="800" fill="#111111" text-anchor="middle">v2 — signed-in shoppers</text>
  <text x="760" y="844" font-size="11.5" fill="#555555" text-anchor="middle">loyalty &amp; member pricing, email prefill,</text>
  <text x="760" y="860" font-size="11.5" fill="#555555" text-anchor="middle">product-page "ask about this" entry points</text>

  <circle cx="1080" cy="820" r="9" fill="#b02230"/>
  <text x="1080" y="802" font-size="13.5" font-weight="800" fill="#b02230" text-anchor="middle">Native payments</text>
  <text x="1080" y="844" font-size="11.5" fill="#555555" text-anchor="middle">when card networks ship trusted-agent</text>
  <text x="1080" y="860" font-size="11.5" fill="#555555" text-anchor="middle">tokens, payment moves into the chat</text>
</svg>
