<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 810" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a8f7d"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b02230"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="810" fill="#FDF8F1"/>

  <!-- title -->
  <text x="48" y="52" font-size="26" font-weight="800" fill="#111111" letter-spacing="-0.5">🎃 Flying Tiger Halloween Agent</text>
  <text x="48" y="76" font-size="13" fill="#8a8273">Buyer-side shopping agent — basket &amp; rules in chat (eve + Claude), checkout via the store's UCP API, payment on the store</text>

  <!-- ===================== LANES ===================== -->
  <rect x="48"  y="110" width="240" height="646" rx="18" fill="#ffffff" stroke="#eadfce"/>
  <rect x="318" y="110" width="600" height="646" rx="18" fill="#ffffff" stroke="#eadfce"/>
  <rect x="948" y="110" width="284" height="646" rx="18" fill="#ffffff" stroke="#eadfce"/>
  <text x="68"  y="140" font-size="11" font-weight="700" fill="#9a8f7d" letter-spacing="2">SHOPPER</text>
  <text x="338" y="140" font-size="11" font-weight="700" fill="#9a8f7d" letter-spacing="2">EVE AGENT APP · NODE 24 · LOCAL OR VERCEL</text>
  <text x="968" y="140" font-size="11" font-weight="700" fill="#9a8f7d" letter-spacing="2">STORE &amp; MODEL</text>

  <!-- ===================== LANE A : shopper ===================== -->
  <rect x="68" y="170" width="200" height="124" rx="16" fill="#efe7dd"/>
  <text x="88" y="198" font-size="14" font-weight="800" fill="#111111">📱 Chat UI</text>
  <text x="88" y="220" font-size="11.5" fill="#555555">web/index.html</text>
  <text x="88" y="238" font-size="11.5" fill="#555555">FT Club look · chat overlay</text>
  <text x="88" y="256" font-size="11.5" fill="#555555">product images · approval card</text>
  <text x="88" y="274" font-size="11.5" fill="#555555">no framework · no build step</text>

  <!-- ===================== LANE B : eve app ===================== -->
  <!-- home channel -->
  <rect x="338" y="170" width="252" height="60" rx="14" fill="#efe7dd"/>
  <text x="356" y="196" font-size="13" font-weight="800" fill="#111111">channels/home.ts</text>
  <text x="356" y="214" font-size="11.5" fill="#555555">serves the chat UI at GET /</text>

  <!-- http channel -->
  <rect x="338" y="258" width="560" height="60" rx="14" fill="#efe7dd"/>
  <text x="356" y="284" font-size="13" font-weight="800" fill="#111111">eve HTTP channel</text>
  <text x="356" y="302" font-size="11.5" fill="#555555">/eve/v1 sessions · NDJSON event stream · approval round-trips</text>

  <!-- agent loop -->
  <rect x="338" y="346" width="560" height="64" rx="14" fill="#111111"/>
  <text x="356" y="373" font-size="13.5" font-weight="800" fill="#ffffff">Agent loop — claude-sonnet-5</text>
  <text x="356" y="392" font-size="11.5" fill="#cfcabe">eve runtime · @ai-sdk/anthropic (workspace-scoped key) · reasoning: low</text>

  <!-- tools group -->
  <rect x="338" y="438" width="560" height="96" rx="14" fill="none" stroke="#d8cdbb" stroke-dasharray="4 4"/>
  <text x="352" y="431" font-size="10.5" font-weight="700" fill="#9a8f7d" letter-spacing="1.5">TOOLS</text>
  <rect x="350" y="456" width="127" height="64" rx="12" fill="#efe7dd"/>
  <text x="363" y="482" font-size="12" font-weight="800" fill="#111111">halloween_search</text>
  <text x="363" y="500" font-size="10.5" fill="#555555">live catalog + images</text>
  <rect x="487" y="456" width="127" height="64" rx="12" fill="#efe7dd"/>
  <text x="500" y="482" font-size="12" font-weight="800" fill="#111111">check_rules</text>
  <text x="500" y="500" font-size="10.5" fill="#555555">cutoff · £40 · £115 · age</text>
  <rect x="624" y="456" width="127" height="64" rx="12" fill="#efe7dd" stroke="#b02230" stroke-width="1.5"/>
  <text x="637" y="482" font-size="12" font-weight="800" fill="#111111">checkout 🔒</text>
  <text x="637" y="500" font-size="10.5" fill="#555555">approval-gated · UCP</text>
  <rect x="761" y="456" width="127" height="64" rx="12" fill="#efe7dd"/>
  <text x="774" y="482" font-size="12" font-weight="800" fill="#111111">store_locator</text>
  <text x="774" y="500" font-size="10.5" fill="#555555">after 22 Oct cutoff</text>

  <!-- libs group -->
  <rect x="338" y="558" width="560" height="100" rx="14" fill="none" stroke="#d8cdbb" stroke-dasharray="4 4"/>
  <text x="352" y="551" font-size="10.5" font-weight="700" fill="#9a8f7d" letter-spacing="1.5">LIB</text>
  <rect x="350" y="576" width="168" height="66" rx="12" fill="#efe7dd"/>
  <text x="363" y="600" font-size="12" font-weight="800" fill="#111111">rules.ts</text>
  <text x="363" y="616" font-size="10.5" fill="#555555">pure · 8 unit tests</text>
  <text x="363" y="631" font-size="10.5" fill="#555555">future eval judge</text>
  <rect x="534" y="576" width="168" height="66" rx="12" fill="#efe7dd"/>
  <text x="547" y="600" font-size="12" font-weight="800" fill="#111111">ucp.ts</text>
  <text x="547" y="616" font-size="10.5" fill="#555555">UCP MCP client</text>
  <text x="547" y="631" font-size="10.5" fill="#555555">injects agent profile</text>
  <rect x="718" y="576" width="168" height="66" rx="12" fill="#efe7dd"/>
  <text x="731" y="600" font-size="12" font-weight="800" fill="#111111">catalog.ts</text>
  <text x="731" y="616" font-size="10.5" fill="#555555">live fetch · 10-min cache</text>
  <text x="731" y="631" font-size="10.5" fill="#555555">frozen snapshot fallback</text>

  <!-- mcp connection -->
  <rect x="338" y="682" width="560" height="48" rx="14" fill="#efe7dd"/>
  <text x="356" y="702" font-size="12" font-weight="800" fill="#111111">connections/flying-tiger.ts</text>
  <text x="356" y="719" font-size="10.5" fill="#555555">UCP catalog tools (search · lookup · product) exposed straight to the model via MCP</text>

  <!-- ===================== LANE C : external ===================== -->
  <!-- hosted checkout -->
  <rect x="968" y="170" width="244" height="110" rx="16" fill="#fdf0ef" stroke="#b02230" stroke-width="1.5"/>
  <text x="986" y="198" font-size="13" font-weight="800" fill="#b02230">Store hosted checkout</text>
  <text x="986" y="218" font-size="11.5" fill="#555555">address · shipping · payment</text>
  <text x="986" y="236" font-size="11.5" fill="#555555">Google Pay · card · Shop Pay</text>
  <text x="986" y="258" font-size="10.5" font-style="italic" fill="#8a8273">real orders — the store keeps</text>
  <text x="986" y="272" font-size="10.5" font-style="italic" fill="#8a8273">payment on its own rails</text>

  <!-- anthropic -->
  <rect x="968" y="346" width="244" height="64" rx="14" fill="#efe7dd"/>
  <text x="986" y="373" font-size="13" font-weight="800" fill="#111111">Anthropic API</text>
  <text x="986" y="391" font-size="11.5" fill="#555555">tokens · ~$0.10/basket (sonnet)</text>

  <!-- ucp endpoint -->
  <rect x="968" y="452" width="244" height="92" rx="14" fill="#e8efe9" stroke="#1d6b47" stroke-width="1.5"/>
  <text x="986" y="478" font-size="13" font-weight="800" fill="#1d6b47">UCP endpoint (Shopify)</text>
  <text x="986" y="496" font-size="10.5" fill="#555555">ftc-row.myshopify.com/api/ucp/mcp</text>
  <text x="986" y="512" font-size="10.5" fill="#555555">spec 2026-08-25 · carts &amp; checkouts</text>
  <text x="986" y="528" font-size="10.5" fill="#555555">validates our gist-hosted agent profile</text>

  <!-- products.json -->
  <rect x="968" y="576" width="244" height="66" rx="14" fill="#efe7dd"/>
  <text x="986" y="600" font-size="13" font-weight="800" fill="#111111">flyingtiger.com /en-gb</text>
  <text x="986" y="617" font-size="10.5" fill="#555555">collections products.json</text>
  <text x="986" y="632" font-size="10.5" fill="#555555">GBP prices · live stock · 9 collections</text>

  <!-- ===================== ARROWS ===================== -->
  <!-- home serves page (dashed grey) -->
  <path d="M338,200 L268,208" fill="none" stroke="#9a8f7d" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ag)"/>

  <!-- 1 chat message -->
  <path d="M268,238 C306,240 306,276 334,284" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ab)"/>
  <circle cx="300" cy="252" r="10" fill="#111111"/>
  <text x="300" y="256" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>

  <!-- stream back -->
  <path d="M334,302 C300,306 296,268 268,262" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ab)"/>
  <text x="252" y="322" font-size="10.5" fill="#8a8273">chat ⇅ NDJSON stream</text>

  <!-- http -> loop -->
  <path d="M618,318 L618,342" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ab)"/>

  <!-- 2 loop <-> anthropic -->
  <path d="M898,378 L964,378" fill="none" stroke="#111111" stroke-width="2" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <circle cx="931" cy="364" r="10" fill="#111111"/>
  <text x="931" y="368" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>

  <!-- loop -> tools -->
  <path d="M618,410 L618,434" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ab)"/>

  <!-- tools -> libs -->
  <path d="M618,534 L618,554" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ab)"/>

  <!-- 3 catalog -> products.json -->
  <path d="M886,609 L964,609" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ab)"/>
  <circle cx="925" cy="595" r="10" fill="#111111"/>
  <text x="925" y="599" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>

  <!-- 4 ucp.ts -> ucp endpoint -->
  <path d="M702,590 C780,548 900,548 962,508" fill="none" stroke="#1d6b47" stroke-width="2" marker-end="url(#ab)"/>
  <circle cx="930" cy="527" r="10" fill="#1d6b47"/>
  <text x="930" y="531" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
  <text x="712" y="542" font-size="10.5" fill="#1d6b47">create_checkout → totals + pay_url</text>

  <!-- connection -> ucp endpoint (dashed) -->
  <path d="M898,700 C950,696 980,600 1020,548" fill="none" stroke="#9a8f7d" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <text x="940" y="688" font-size="10.5" fill="#9a8f7d">MCP tools</text>

  <!-- 5 shopper taps pay link : across the top -->
  <path d="M168,166 C168,96 1090,96 1090,166" fill="none" stroke="#b02230" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="630" cy="96" r="10" fill="#b02230"/>
  <text x="630" y="100" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
  <text x="648" y="100" font-size="11" fill="#b02230">shopper taps pay_url — pays on the store, card data never touches the agent</text>

  <!-- ===================== LEGEND ===================== -->
  <text x="48"  y="788" font-size="11" fill="#8a8273">— runtime flow</text>
  <text x="160" y="788" font-size="11" fill="#1d6b47">— UCP protocol (agent-profile authenticated)</text>
  <text x="430" y="788" font-size="11" fill="#b02230">— payment hand-off (real money, store rails)</text>
  <text x="700" y="788" font-size="11" fill="#9a8f7d">┄ serving / config</text>
  <text x="900" y="788" font-size="11" fill="#8a8273">flow: ① chat ② reason ③ browse ④ checkout ⑤ pay</text>
</svg>
